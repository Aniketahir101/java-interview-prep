<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Backend Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
<style>
  :root {
    --bg:        #080c14;
    --bg2:       #0e1420;
    --bg3:       #141924;
    --border:    #1e2535;
    --accent:    #22d3ee;
    --accent2:   #0e9aaf;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --soft:      #94a3b8;
    --green:     #34d399;
    --amber:     #fbbf24;
    --red:       #f87171;
    --sidebar-w: 260px;
    --header-h:  60px;
    --radius:    10px;
    --font:      'DM Sans', sans-serif;
    --mono:      'JetBrains Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--header-h);
    background: rgba(8,12,20,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
  }
  .logo {
    font-size: 15px; font-weight: 600; color: var(--text);
    white-space: nowrap; display: flex; align-items: center; gap: 8px;
  }
  .logo span { color: var(--accent); }
  .search-wrap {
    flex: 1; max-width: 480px; position: relative;
  }
  .search-wrap input {
    width: 100%; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--font); font-size: 13.5px;
    padding: 8px 14px 8px 36px; outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 14px; pointer-events: none;
  }
  .header-stats { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .header-stats strong { color: var(--accent); }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    padding-top: var(--header-h);
    min-height: 100vh;
  }

  /* ── SIDEBAR ── */
  aside {
    width: var(--sidebar-w); flex-shrink: 0;
    position: fixed; top: var(--header-h); bottom: 0; left: 0;
    overflow-y: auto; overflow-x: hidden;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    padding: 20px 0 40px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .sidebar-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted);
    padding: 0 20px 8px;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 20px; cursor: pointer;
    font-size: 13px; color: var(--soft);
    transition: background 0.15s, color 0.15s;
    border-left: 2px solid transparent;
    text-decoration: none;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active {
    color: var(--accent); background: rgba(34,211,238,0.06);
    border-left-color: var(--accent);
  }
  .nav-item-left { display: flex; align-items: center; gap: 8px; }
  .nav-icon { font-size: 14px; }
  .nav-count {
    font-size: 11px; background: var(--bg3); color: var(--muted);
    border-radius: 10px; padding: 1px 7px; font-family: var(--mono);
  }
  .nav-item.active .nav-count { background: rgba(34,211,238,0.12); color: var(--accent); }

  /* ── MAIN ── */
  main {
    flex: 1; margin-left: var(--sidebar-w);
    padding: 40px 48px 80px;
    max-width: 900px;
  }

  /* ── SECTION ── */
  .section-block { margin-bottom: 56px; }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .section-emoji { font-size: 22px; }
  .section-title { font-size: 20px; font-weight: 600; color: var(--text); }
  .section-pill {
    margin-left: auto; font-size: 11px; font-family: var(--mono);
    background: rgba(34,211,238,0.08); color: var(--accent);
    border: 1px solid rgba(34,211,238,0.2);
    border-radius: 20px; padding: 2px 10px;
  }

  /* ── QUESTION CARD ── */
  .question-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .question-card:hover { border-color: #2a3347; }
  .question-card.open {
    border-color: rgba(34,211,238,0.3);
    box-shadow: 0 0 0 1px rgba(34,211,238,0.08), 0 4px 24px rgba(0,0,0,0.3);
  }

  .question-trigger {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 20px; cursor: pointer;
    user-select: none;
  }
  .q-number {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); padding-top: 2px;
    min-width: 22px;
  }
  .q-text {
    flex: 1; font-size: 14.5px; font-weight: 500; color: var(--text);
    line-height: 1.5;
  }
  .q-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
  .tag {
    font-size: 11px; font-family: var(--mono); font-weight: 400;
    background: var(--bg3); color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 7px;
  }
  .chevron {
    width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px;
    color: var(--muted); transition: transform 0.25s, color 0.2s;
  }
  .question-card.open .chevron { transform: rotate(180deg); color: var(--accent); }

  /* ── ANSWER PANEL ── */
  .answer-panel {
    display: none;
    border-top: 1px solid var(--border);
  }
  .question-card.open .answer-panel { display: block; }

  .answer-loading {
    display: flex; align-items: center; gap: 10px;
    padding: 24px 20px; color: var(--muted); font-size: 13px;
  }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .answer-sections { padding: 0 20px 20px; }

  .answer-tab {
    border-top: 1px solid var(--border);
    padding: 16px 0 0;
    margin-top: 4px;
  }
  .answer-tab:first-child { border-top: none; padding-top: 20px; }

  .tab-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .tab-label::before {
    content: ''; display: inline-block;
    width: 3px; height: 12px; border-radius: 2px;
    background: var(--accent);
  }

  .answer-tab p { font-size: 14px; color: var(--soft); margin-bottom: 10px; line-height: 1.7; }
  .answer-tab p:last-child { margin-bottom: 0; }
  .answer-tab ul, .answer-tab ol { padding-left: 20px; color: var(--soft); font-size: 14px; }
  .answer-tab li { margin-bottom: 5px; line-height: 1.6; }
  .answer-tab h4, .answer-tab h5, .answer-tab h6 {
    color: var(--text); font-weight: 600; margin: 14px 0 6px;
    font-size: 14px;
  }
  .answer-tab blockquote {
    border-left: 3px solid var(--accent); padding-left: 14px;
    color: var(--soft); font-style: italic; margin: 10px 0;
  }
  .answer-tab .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .answer-tab .callout {
    display: flex; gap: 10px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 13.5px; color: var(--soft);
    margin: 10px 0;
  }
  .inline-code {
    font-family: var(--mono); font-size: 12.5px;
    background: var(--bg3); color: var(--accent);
    padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* ── CODE BLOCKS ── */
  .answer-tab pre {
    background: #0d111a !important;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    overflow-x: auto;
    margin: 8px 0 12px;
    font-size: 13px !important;
    line-height: 1.6 !important;
  }
  .answer-tab pre code {
    font-family: var(--mono) !important;
    font-size: 13px !important;
    background: none !important;
    border: none !important;
    padding: 0 !important;
  }

  /* ── EMPTY / ERROR STATES ── */
  .state-box {
    text-align: center; padding: 80px 40px;
    color: var(--muted); font-size: 14px;
  }
  .state-box h3 { font-size: 18px; color: var(--soft); margin-bottom: 8px; }

  .no-results { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }

  /* ── SEARCH HIGHLIGHT ── */
  mark { background: rgba(251,191,36,0.25); color: var(--amber); border-radius: 2px; }

  /* ── SCROLL MARGIN ── */
  .section-block { scroll-margin-top: calc(var(--header-h) + 24px); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    aside { display: none; }
    main { margin-left: 0; padding: 24px 20px 60px; }
    .header-stats { display: none; }
  }

  /* ── FADE IN ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .section-block {
    animation: fadeUp 0.4s ease both;
  }
  .section-block:nth-child(1)  { animation-delay: 0.05s; }
  .section-block:nth-child(2)  { animation-delay: 0.10s; }
  .section-block:nth-child(3)  { animation-delay: 0.15s; }
  .section-block:nth-child(4)  { animation-delay: 0.20s; }
  .section-block:nth-child(5)  { animation-delay: 0.25s; }
</style>
</head>
<body>

<header>
  <div class="logo">☕ <span>Java</span> Interview Prep</div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search questions..." autocomplete="off" spellcheck="false">
  </div>
  <div class="header-stats" id="header-stats"></div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="state-box" id="loading-state">
      <div class="spinner" style="width:24px;height:24px;margin:0 auto 16px;border-width:3px"></div>
      <h3>Loading questions…</h3>
      <p>Fetching from Notion database</p>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script>
let allSections = [];
let searchQuery = '';

// ── FETCH QUESTIONS ──
async function init() {
  try {
    const res = await fetch('/api/questions');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { sections } = await res.json();
    allSections = sections;

    const total = sections.reduce((s, sec) => s + sec.questions.length, 0);
    document.getElementById('header-stats').innerHTML =
      `<strong>${total}</strong> questions across <strong>${sections.length}</strong> topics`;

    renderSidebar(sections);
    renderMain(sections);
    setupSearch();
    setupScrollSpy();
  } catch (err) {
    document.getElementById('loading-state').innerHTML = `
      <h3>Failed to load</h3>
      <p>${err.message}</p>`;
  }
}

// ── SIDEBAR ──
function renderSidebar(sections) {
  const aside = document.getElementById('sidebar');
  aside.innerHTML = `<div class="sidebar-label">Topics</div>` +
    sections.map(s => `
      <a class="nav-item" href="#${s.slug}" data-slug="${s.slug}">
        <span class="nav-item-left">
          <span class="nav-icon">${s.icon}</span>
          <span>${s.name}</span>
        </span>
        <span class="nav-count">${s.count}</span>
      </a>`).join('');

  aside.querySelectorAll('.nav-item').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const el = document.getElementById(a.dataset.slug);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ── MAIN CONTENT ──
function renderMain(sections, query = '') {
  const main = document.getElementById('main');

  if (sections.length === 0) {
    main.innerHTML = `<div class="no-results">No questions found matching "<strong>${escHtml(query)}</strong>"</div>`;
    return;
  }

  main.innerHTML = sections.map(section => {
    const questions = section.questions.map((q, i) => {
      const title = query ? highlight(q.question, query) : escHtml(q.question);
      const tags = q.subTopics.map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
      return `
        <div class="question-card" id="card-${q.id}" data-id="${q.id}">
          <div class="question-trigger" onclick="toggleCard('${q.id}')">
            <span class="q-number">${String(i + 1).padStart(2, '0')}</span>
            <div class="q-text">
              ${title}
              ${tags ? `<div class="q-meta">${tags}</div>` : ''}
            </div>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="answer-panel" id="panel-${q.id}">
            <div class="answer-loading">
              <div class="spinner"></div> Loading answer…
            </div>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="section-block" id="${section.slug}">
        <div class="section-header">
          <span class="section-emoji">${section.icon}</span>
          <h2 class="section-title">${section.name}</h2>
          <span class="section-pill">${section.count} questions</span>
        </div>
        ${questions}
      </div>`;
  }).join('');
}

// ── TOGGLE CARD ──
const loadedPages = {};

async function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  const panel = document.getElementById(`panel-${id}`);
  const isOpen = card.classList.contains('open');

  // Close all open cards
  document.querySelectorAll('.question-card.open').forEach(c => c.classList.remove('open'));

  if (isOpen) return;

  card.classList.add('open');

  // Already loaded
  if (loadedPages[id]) {
    renderAnswerPanel(panel, loadedPages[id]);
    return;
  }

  // Fetch from API
  try {
    const res = await fetch(`/api/page?id=${id}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    loadedPages[id] = data;
    renderAnswerPanel(panel, data);
  } catch (err) {
    panel.innerHTML = `<div class="answer-loading" style="color:#f87171">Failed to load answer: ${err.message}</div>`;
  }
}

// ── RENDER ANSWER PANEL ──
const TAB_CONFIG = [
  { key: 'Answer',               label: 'Answer',               icon: '💬' },
  { key: 'Code Example',         label: 'Code Example',         icon: '⌨' },
  { key: 'Key Points',           label: 'Key Points',           icon: '📌' },
  { key: 'Follow-up Questions',  label: 'Follow-up Questions',  icon: '🔁' },
];

function renderAnswerPanel(panel, data) {
  const tabs = TAB_CONFIG
    .filter(t => data[t.key] && data[t.key].trim())
    .map(t => `
      <div class="answer-tab">
        <div class="tab-label">${t.icon} ${t.label}</div>
        ${data[t.key]}
      </div>`).join('');

  panel.innerHTML = tabs
    ? `<div class="answer-sections">${tabs}</div>`
    : `<div class="answer-loading" style="color:#64748b">No content found for this question.</div>`;

  // Re-run Prism on new content
  if (window.Prism) Prism.highlightAllUnder(panel);
}

// ── SEARCH ──
function setupSearch() {
  const input = document.getElementById('search');
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      searchQuery = input.value.trim().toLowerCase();
      filterAndRender();
    }, 200);
  });
}

function filterAndRender() {
  if (!searchQuery) {
    renderMain(allSections);
    updateSidebarCounts(allSections);
    return;
  }
  const filtered = allSections.map(s => ({
    ...s,
    questions: s.questions.filter(q =>
      q.question.toLowerCase().includes(searchQuery) ||
      q.subTopics.some(t => t.toLowerCase().includes(searchQuery))
    ),
    count: s.questions.filter(q =>
      q.question.toLowerCase().includes(searchQuery) ||
      q.subTopics.some(t => t.toLowerCase().includes(searchQuery))
    ).length,
  })).filter(s => s.questions.length > 0);

  renderMain(filtered, searchQuery);
  updateSidebarCounts(filtered);
}

function updateSidebarCounts(sections) {
  document.querySelectorAll('.nav-item').forEach(a => {
    const slug = a.dataset.slug;
    const sec = sections.find(s => s.slug === slug);
    const countEl = a.querySelector('.nav-count');
    if (countEl) countEl.textContent = sec ? sec.count : '0';
    a.style.opacity = sec ? '1' : '0.35';
  });
}

// ── SCROLL SPY ──
function setupScrollSpy() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const slug = e.target.id;
        document.querySelectorAll('.nav-item').forEach(a => {
          a.classList.toggle('active', a.dataset.slug === slug);
        });
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });

  document.querySelectorAll('.section-block').forEach(el => observer.observe(el));
}

// ── UTILS ──
function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function highlight(text, query) {
  const escaped = escHtml(text);
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

init();
</script>
</body>
</html>
