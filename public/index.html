<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Backend Interview Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link id="prism-dark"  href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
<link id="prism-light" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" disabled>
<style>
  :root {
    --bg:        #080c14;
    --bg2:       #0e1420;
    --bg3:       #141924;
    --border:    #1e2535;
    --accent:    #22d3ee;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --soft:      #94a3b8;
    --green:     #34d399;
    --amber:     #fbbf24;
    --red:       #f87171;
    --purple:    #a78bfa;
    --sidebar-w: 260px;
    --header-h:  60px;
    --radius:    10px;
    --font:      'DM Sans', sans-serif;
    --mono:      'JetBrains Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.65; min-height: 100vh; }

  /* ── LOGIN SCREEN ── */
  #login-screen {
    display: none;
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg);
    align-items: center; justify-content: center;
  }
  #login-screen.visible { display: flex; }
  .login-card {
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 16px; padding: 48px 40px;
    width: 100%; max-width: 400px; text-align: center;
  }
  .login-logo { font-size: 40px; margin-bottom: 16px; }
  .login-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .login-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }
  .login-input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--font);
    font-size: 15px; padding: 12px 16px; outline: none;
    transition: border-color 0.2s; text-align: center;
    margin-bottom: 12px;
  }
  .login-input:focus { border-color: var(--accent); }
  .login-input::placeholder { color: var(--muted); }
  .login-btn {
    width: 100%; background: var(--accent); border: none;
    border-radius: 8px; color: #080c14; font-family: var(--font);
    font-size: 15px; font-weight: 600; padding: 12px;
    cursor: pointer; transition: opacity 0.2s;
  }
  .login-btn:hover { opacity: 0.88; }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error {
    font-size: 13px; color: var(--red);
    margin-top: 12px; min-height: 20px;
  }
  .login-hint { font-size: 12px; color: var(--muted); margin-top: 20px; }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--header-h);
    background: rgba(8,12,20,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; padding: 0 24px;
  }
  .logo { font-size: 15px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .logo span { color: var(--accent); }
  .search-wrap { flex: 1; max-width: 480px; position: relative; }
  .search-wrap input {
    width: 100%; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: var(--font);
    font-size: 13.5px; padding: 8px 14px 8px 36px; outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; pointer-events: none; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .header-stats { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .header-stats strong { color: var(--accent); }
  .user-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 12px; font-size: 13px;
  }
  .user-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .user-name { color: var(--soft); }
  .logout-btn {
    font-size: 12px; color: var(--muted); background: none; border: none;
    cursor: pointer; padding: 2px 4px; transition: color 0.15s;
    font-family: var(--font);
  }
  .logout-btn:hover { color: var(--red); }

  /* ── LAYOUT ── */
  .layout { display: flex; padding-top: var(--header-h); min-height: 100vh; }

  /* ── SIDEBAR ── */
  aside {
    width: var(--sidebar-w); flex-shrink: 0;
    position: fixed; top: var(--header-h); bottom: 0; left: 0;
    overflow-y: auto; background: var(--bg2); border-right: 1px solid var(--border);
    padding: 20px 0 40px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .sidebar-label { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 0 20px 8px; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 20px; cursor: pointer; font-size: 13px; color: var(--soft);
    transition: background 0.15s, color 0.15s; border-left: 2px solid transparent; text-decoration: none;
  }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { color: var(--accent); background: rgba(34,211,238,0.06); border-left-color: var(--accent); }
  .nav-item-left { display: flex; align-items: center; gap: 8px; }
  .nav-icon { font-size: 14px; }
  .nav-count { font-size: 11px; background: var(--bg3); color: var(--muted); border-radius: 10px; padding: 1px 7px; font-family: var(--mono); }
  .nav-item.active .nav-count { background: rgba(34,211,238,0.12); color: var(--accent); }

  /* ── MAIN ── */
  main { flex: 1; margin-left: var(--sidebar-w); padding: 40px 48px 80px; max-width: 900px; }

  /* ── SECTION ── */
  .section-block { margin-bottom: 56px; scroll-margin-top: calc(var(--header-h) + 24px); }
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .section-emoji { font-size: 22px; }
  .section-title { font-size: 20px; font-weight: 600; }
  .section-pill { margin-left: auto; font-size: 11px; font-family: var(--mono); background: rgba(34,211,238,0.08); color: var(--accent); border: 1px solid rgba(34,211,238,0.2); border-radius: 20px; padding: 2px 10px; }

  /* ── SKELETON ── */
  .skeleton-row { height: 54px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; position: relative; overflow: hidden; }
  .skeleton-row::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.03) 50%, transparent 100%); animation: shimmer 1.6s ease-in-out infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  /* ── QUESTION CARD ── */
  .question-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s, box-shadow 0.2s; animation: fadeUp 0.3s ease both; }
  .question-card:hover { border-color: #2a3347; }
  .question-card.open { border-color: rgba(34,211,238,0.3); box-shadow: 0 0 0 1px rgba(34,211,238,0.08), 0 4px 24px rgba(0,0,0,0.3); }
  .question-trigger { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px 14px 20px; cursor: pointer; user-select: none; }
  .q-number { font-family: var(--mono); font-size: 11px; color: var(--muted); padding-top: 3px; min-width: 22px; }
  .q-body { flex: 1; min-width: 0; }
  .q-text { font-size: 14.5px; font-weight: 500; line-height: 1.5; }
  .q-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
  .tag { font-size: 11px; font-family: var(--mono); background: var(--bg3); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 7px; }
  .q-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-top: 1px; }
  .chevron { width: 18px; height: 18px; color: var(--muted); transition: transform 0.25s, color 0.2s; flex-shrink: 0; }
  .question-card.open .chevron { transform: rotate(180deg); color: var(--accent); }

  /* ── STATUS BADGE ── */
  .status-badge {
    font-size: 11px; font-family: var(--mono); font-weight: 500;
    border-radius: 20px; padding: 3px 10px; cursor: pointer;
    border: 1px solid transparent; white-space: nowrap;
    transition: opacity 0.15s, transform 0.1s;
    user-select: none;
  }
  .status-badge:hover { opacity: 0.8; transform: scale(0.97); }
  .status-badge.not-started  { background: rgba(100,116,139,0.15); color: var(--muted);  border-color: rgba(100,116,139,0.3); }
  .status-badge.in-progress  { background: rgba(251,191,36,0.12);  color: var(--amber);  border-color: rgba(251,191,36,0.3); }
  .status-badge.revision     { background: rgba(248,113,113,0.12); color: var(--red);    border-color: rgba(248,113,113,0.3); }
  .status-badge.confident    { background: rgba(52,211,153,0.12);  color: var(--green);  border-color: rgba(52,211,153,0.3); }

  /* ── STATUS PICKER (dropdown) ── */
  .status-picker {
    position: absolute; z-index: 50;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: none; flex-direction: column; gap: 2px;
    min-width: 160px;
  }
  .status-picker.open { display: flex; }
  .picker-option {
    font-size: 13px; padding: 8px 12px; border-radius: 6px;
    cursor: pointer; transition: background 0.12s;
    display: flex; align-items: center; gap: 8px;
  }
  .picker-option:hover { background: var(--bg3); }
  .picker-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── ANSWER PANEL ── */
  .answer-panel { display: none; border-top: 1px solid var(--border); }
  .question-card.open .answer-panel { display: block; }
  .answer-loading { display: flex; align-items: center; gap: 10px; padding: 24px 20px; color: var(--muted); font-size: 13px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .answer-sections { padding: 0 20px 20px; }
  .answer-tab { border-top: 1px solid var(--border); padding: 16px 0 0; margin-top: 4px; }
  .answer-tab:first-child { border-top: none; padding-top: 20px; }
  .tab-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .tab-label::before { content: ''; display: inline-block; width: 3px; height: 12px; border-radius: 2px; background: var(--accent); }
  .answer-tab p { font-size: 14px; color: var(--soft); margin-bottom: 10px; line-height: 1.7; }
  .answer-tab p:last-child { margin-bottom: 0; }
  .answer-tab ul, .answer-tab ol { padding-left: 20px; color: var(--soft); font-size: 14px; }
  .answer-tab li { margin-bottom: 5px; line-height: 1.6; }
  .answer-tab h4, .answer-tab h5, .answer-tab h6 { color: var(--text); font-weight: 600; margin: 14px 0 6px; font-size: 14px; }
  .answer-tab blockquote { border-left: 3px solid var(--accent); padding-left: 14px; color: var(--soft); font-style: italic; margin: 10px 0; }
  .answer-tab .divider { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .answer-tab .callout { display: flex; gap: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 13.5px; color: var(--soft); margin: 10px 0; }
  .inline-code { font-family: var(--mono); font-size: 12.5px; background: var(--bg3); color: var(--accent); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }
  .answer-tab pre { background: #0d111a !important; border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; overflow-x: auto; margin: 8px 0 12px; font-size: 13px !important; line-height: 1.6 !important; }
  .answer-tab pre code { font-family: var(--mono) !important; font-size: 13px !important; background: none !important; border: none !important; padding: 0 !important; }

  /* ── STATES ── */
  .state-box { text-align: center; padding: 80px 40px; color: var(--muted); font-size: 14px; }
  .state-box h3 { font-size: 18px; color: var(--soft); margin-bottom: 8px; }
  .no-results { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }
  mark { background: rgba(251,191,36,0.25); color: var(--amber); border-radius: 2px; }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .section-block { animation: fadeUp 0.35s ease both; }
  .section-block:nth-child(1) { animation-delay: 0.04s; }
  .section-block:nth-child(2) { animation-delay: 0.08s; }
  .section-block:nth-child(3) { animation-delay: 0.12s; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    aside { display: none; }
    main { margin-left: 0; padding: 24px 20px 60px; }
    .header-stats { display: none; }
  }

  /* ── LIGHT MODE ── */
  body.light {
    --bg: #f8fafc; --bg2: #ffffff; --bg3: #f1f5f9; --border: #e2e8f0;
    --text: #0f172a; --muted: #64748b; --soft: #334155;
    --accent: #0891b2; --green: #059669; --amber: #d97706; --red: #dc2626;
  }
  body.light header { background: rgba(248,250,252,0.92); }
  body.light aside  { background: var(--bg2); }
  body.light .question-card.open { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  body.light .status-picker { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
  body.light .answer-tab pre { background: #f1f5f9 !important; border-color: #e2e8f0; }
  body.light .skeleton-row::after { background: linear-gradient(90deg,transparent,rgba(0,0,0,0.04),transparent); }

  /* ── FONT SIZES ── */
  body.font-sm .q-text { font-size: 13px; }
  body.font-sm .answer-tab p, body.font-sm .answer-tab li { font-size: 12.5px; }
  body.font-sm .answer-tab pre, body.font-sm .answer-tab pre code { font-size: 12px !important; }
  body.font-lg .q-text { font-size: 16.5px; }
  body.font-lg .answer-tab p, body.font-lg .answer-tab li { font-size: 15.5px; }
  body.font-lg .answer-tab pre, body.font-lg .answer-tab pre code { font-size: 14.5px !important; }

  /* ── HEADER CONTROLS ── */
  .ctrl-btn {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    color: var(--soft); font-size: 13px; padding: 6px 10px; cursor: pointer;
    transition: all 0.15s; font-family: var(--font); white-space: nowrap;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--text); }

  /* ── SECTION ACTIONS ── */
  .section-actions { display: flex; gap: 4px; margin-left: 8px; }
  .section-action-btn {
    font-size: 11px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 6px; color: var(--muted); padding: 2px 8px; cursor: pointer;
    font-family: var(--mono); transition: color 0.15s, border-color 0.15s;
  }
  .section-action-btn:hover { color: var(--accent); border-color: rgba(34,211,238,0.4); }

  /* ── COPY BUTTON ── */
  .answer-tab pre { position: relative; }
  .copy-btn {
    position: absolute; top: 8px; right: 8px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); font-size: 11px; padding: 3px 8px; cursor: pointer;
    font-family: var(--mono); opacity: 0; transition: opacity 0.15s, color 0.15s, border-color 0.15s;
  }
  .answer-tab pre:hover .copy-btn { opacity: 1; }
  .copy-btn.copied { color: var(--green); border-color: var(--green); opacity: 1; }

  /* ── STATUS FILTER ── */
  .filter-section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 6px;
  }
  .filter-pills { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 16px 14px; }
  .filter-pill {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--bg3);
    color: var(--muted); cursor: pointer; font-family: var(--mono);
    transition: all 0.15s; white-space: nowrap; user-select: none;
  }
  .filter-pill:hover  { border-color: var(--accent); color: var(--text); }
  .filter-pill.active { background: rgba(34,211,238,0.12); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .filter-clear {
    font-size: 11px; color: var(--muted); cursor: pointer; font-family: var(--mono);
    transition: color 0.15s; padding: 2px 0;
  }
  .filter-clear:hover { color: var(--red); }
  .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0 8px; }

  /* ── ACTIVE FILTER BANNER ── */
  .filter-banner {
    display: none; align-items: center; justify-content: space-between;
    background: rgba(34,211,238,0.06); border-bottom: 1px solid rgba(34,211,238,0.15);
    padding: 7px 20px; font-size: 12px; color: var(--accent);
    position: sticky; top: var(--header-h); z-index: 10;
  }
  .filter-banner.visible { display: flex; }
  .filter-banner-clear { cursor: pointer; color: var(--muted); font-size: 11px; }
  .filter-banner-clear:hover { color: var(--red); }

  /* ── SURPRISE ME ── */
  .surprise-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 8px 16px 16px; padding: 9px 12px; width: calc(100% - 32px);
    background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
    color: var(--soft); font-size: 13px; cursor: pointer; font-family: var(--font);
    transition: all 0.15s;
  }
  .surprise-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(34,211,238,0.04); }
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">☕</div>
    <div class="login-title">Java Interview Prep</div>
    <div class="login-sub">Enter your username to continue</div>
    <input
      type="text" id="login-input" class="login-input"
      placeholder="your username" autocomplete="off"
      spellcheck="false" autocapitalize="none"
    >
    <button class="login-btn" id="login-btn" onclick="doLogin()">Enter</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">Only team members can access this site.</div>
  </div>
</div>

<!-- ── STATUS PICKER ── -->
<div class="status-picker" id="status-picker">
  <div class="picker-option" onclick="setStatus('Not Started')">
    <span class="picker-dot" style="background:var(--muted)"></span> Not Started
  </div>
  <div class="picker-option" onclick="setStatus('In Progress')">
    <span class="picker-dot" style="background:var(--amber)"></span> In Progress
  </div>
  <div class="picker-option" onclick="setStatus('Revision Needed')">
    <span class="picker-dot" style="background:var(--red)"></span> Revision Needed
  </div>
  <div class="picker-option" onclick="setStatus('Confident')">
    <span class="picker-dot" style="background:var(--green)"></span> Confident
  </div>
</div>

<!-- ── HEADER ── -->
<header>
  <div class="logo">☕ <span>Java</span> Interview Prep</div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search questions..." autocomplete="off" spellcheck="false">
  </div>
  <div class="header-right">
    <button class="ctrl-btn" id="font-btn"  onclick="cycleFontSize()" title="Adjust font size">A</button>
    <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()"   title="Toggle theme">🌙</button>
    <div class="header-stats" id="header-stats"></div>
    <div class="user-pill" id="user-pill" style="display:none">
      <span class="user-dot"></span>
      <span class="user-name" id="user-name"></span>
      <button class="logout-btn" onclick="doLogout()" title="Log out">✕</button>
    </div>
  </div>
</header>

<div class="filter-banner" id="filter-banner">
  <span id="filter-banner-text"></span>
  <span class="filter-banner-clear" onclick="setStatusFilter('')">✕ Clear filter</span>
</div>
<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main">
    <div class="state-box" id="loading-state">
      <div class="spinner" style="width:24px;height:24px;margin:0 auto 16px;border-width:3px"></div>
      <h3>Loading…</h3>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
<script>
// ── STATE ──
let currentUser   = null;
let allSections   = [];
let filteredData  = null;
let renderedSlugs = new Set();
let sectionObs    = null;
let searchQuery   = '';
const loadedPages = {};
let userProgress  = {}; // { questionId: status }

// Active status picker state
let pickerQuestionId = null;
let statusFilter = ''; // active status filter

// ── BOOT ──
async function boot() {
  initPreferences();
  try {
    const res = await fetch('/api/me');
    if (res.ok) {
      const { username } = await res.json();
      currentUser = username;
      showApp();
    } else {
      showLogin();
    }
  } catch {
    showLogin();
  }
}

// ── LOGIN ──
function showLogin() {
  const input  = document.getElementById('login-input');
  const btn    = document.getElementById('login-btn');
  const errEl  = document.getElementById('login-error');
  input.value       = '';
  btn.disabled      = false;
  btn.textContent   = 'Enter';
  errEl.textContent = '';
  document.getElementById('login-screen').classList.add('visible');
  input.focus();
}

document.getElementById('login-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const input    = document.getElementById('login-input');
  const btn      = document.getElementById('login-btn');
  const errorEl  = document.getElementById('login-error');
  const username = input.value.trim().toLowerCase();

  if (!username) return;

  btn.disabled  = true;
  btn.textContent = 'Checking…';
  errorEl.textContent = '';

  try {
    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username }),
    });

    const data = await res.json();

    if (res.ok) {
      currentUser = data.username;
      document.getElementById('login-screen').classList.remove('visible');
      showApp();
    } else {
      errorEl.textContent = data.error || 'Login failed.';
      btn.disabled = false;
      btn.textContent = 'Enter';
      input.focus();
    }
  } catch {
    errorEl.textContent = 'Network error. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Enter';
  }
}

// ── LOGOUT ──
async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  currentUser  = null;
  userProgress = {};
  document.getElementById('user-pill').style.display = 'none';
  document.getElementById('main').innerHTML = '';
  document.getElementById('sidebar').innerHTML = '';
  showLogin();
}

// ── SHOW APP ──
async function showApp() {
  // Show username in header
  document.getElementById('user-name').textContent = currentUser;
  document.getElementById('user-pill').style.display = 'flex';

  // Load questions + progress in parallel
  try {
    const [sectionsRes, progressRes] = await Promise.all([
      fetch('/api/questions'),
      fetch('/api/progress'),
    ]);

    if (!sectionsRes.ok) throw new Error('Failed to load questions');

    const { sections } = await sectionsRes.json();
    allSections = sections;

    if (progressRes.ok) {
      userProgress = await progressRes.json();
    }

    updateHeaderStats(sections);

    renderSidebar(sections);
    renderStubs(sections);
    setupLazyLoad();
    setupSearch();
    setupScrollSpy();
    setupPickerDismiss();

  } catch (err) {
    document.getElementById('loading-state').innerHTML =
      `<h3>Failed to load</h3><p>${escHtml(err.message)}</p>`;
  }
}

// ── SIDEBAR ──
function renderSidebar(sections) {
  const STATUS_OPTS = [
    { value: '',               label: 'All',           cls: '' },
    { value: 'Not Started',    label: 'Not Started',   cls: '' },
    { value: 'In Progress',    label: 'In Progress',   cls: '' },
    { value: 'Revision Needed',label: 'Revision',      cls: '' },
    { value: 'Confident',      label: 'Confident',     cls: '' },
  ];

  document.getElementById('sidebar').innerHTML =
    // ── filter section ──
    `<div class="filter-section-header">
      <span class="sidebar-label" style="padding:0">Filter by status</span>
      <span class="filter-clear" id="filter-clear" onclick="setStatusFilter('')" style="display:none">clear ✕</span>
    </div>
    <div class="filter-pills" id="filter-pills">
      ${STATUS_OPTS.map(o => `<span class="filter-pill ${statusFilter === o.value ? 'active' : ''}" data-value="${o.value}" onclick="setStatusFilter('${o.value}')">${o.label}</span>`).join('')}
    </div>
    <hr class="sidebar-divider">` +
    // ── topics ──
    '<div class="sidebar-label" style="padding: 0 20px 8px">Topics</div>' +
    sections.map(s => `
      <a class="nav-item" href="#${s.slug}" data-slug="${s.slug}">
        <span class="nav-item-left">
          <span class="nav-icon">${s.icon}</span>
          <span>${s.name}</span>
        </span>
        <span class="nav-count" id="cnt-${s.slug}">${s.count}</span>
      </a>`).join('') +
    // ── surprise me ──
    `<hr class="sidebar-divider" style="margin-top:12px">
    <button class="surprise-btn" onclick="surpriseMe()">🎲 Surprise Me</button>`;

  document.querySelectorAll('.nav-item').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(a.dataset.slug)
        ?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
}

// ── STUBS ──
function renderStubs(sections) {
  renderedSlugs.clear();
  document.getElementById('main').innerHTML = sections.map(s => `
    <div class="section-block" id="${s.slug}" data-slug="${s.slug}">
      <div class="section-header">
        <span class="section-emoji">${s.icon}</span>
        <h2 class="section-title">${s.name}</h2>
        <span class="section-pill">${s.count} questions</span>
        <div class="section-actions">
          <button class="section-action-btn" onclick="expandAllInSection('${s.slug}')">expand all</button>
          <button class="section-action-btn" onclick="collapseAllInSection('${s.slug}')">collapse all</button>
        </div>
      </div>
      <div id="qc-${s.slug}">${skeletonRows(Math.min(s.count, 4))}</div>
    </div>`).join('');
}

function skeletonRows(n) {
  return Array(n).fill('<div class="skeleton-row"></div>').join('');
}

// ── LAZY LOAD ──
function setupLazyLoad() {
  if (sectionObs) sectionObs.disconnect();
  sectionObs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const slug = e.target.dataset.slug;
      if (slug && !renderedSlugs.has(slug)) {
        renderSectionQuestions(slug);
        sectionObs.unobserve(e.target);
      }
    });
  }, { rootMargin: '400px 0px' });
  document.querySelectorAll('.section-block').forEach(el => sectionObs.observe(el));
}

// ── RENDER QUESTIONS ──
function renderSectionQuestions(slug, query) {
  const container = document.getElementById(`qc-${slug}`);
  if (!container) return;

  const activeQuery = query !== undefined ? query : searchQuery;
  const source      = filteredData || allSections;
  const section     = source.find(s => s.slug === slug);
  if (!section) return;

  renderedSlugs.add(slug);

  if (section.questions.length === 0) {
    container.innerHTML = `<div style="padding:16px 0;color:var(--muted);font-size:13px">No questions match.</div>`;
    return;
  }

  container.innerHTML = section.questions.map((q, i) => {
    const title  = activeQuery ? highlight(q.question, activeQuery) : escHtml(q.question);
    const tags   = q.subTopics.map(t => `<span class="tag">${escHtml(t)}</span>`).join('');
    const status = userProgress[q.id] || 'Not Started';
    return `
      <div class="question-card" id="card-${q.id}">
        <div class="question-trigger" onclick="toggleCard('${q.id}', event)">
          <span class="q-number">${String(i + 1).padStart(2, '0')}</span>
          <div class="q-body">
            <div class="q-text">${title}</div>
            ${tags ? `<div class="q-meta">${tags}</div>` : ''}
          </div>
          <div class="q-right">
            <span
              class="status-badge ${statusClass(status)}"
              id="badge-${q.id}"
              onclick="openPicker('${q.id}', event)"
              title="Click to change status"
            >${status}</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        <div class="answer-panel" id="panel-${q.id}">
          <div class="answer-loading"><div class="spinner"></div> Loading answer…</div>
        </div>
      </div>`;
  }).join('');
}

// ── STATUS HELPERS ──
function statusClass(status) {
  const map = {
    'Not Started':    'not-started',
    'In Progress':    'in-progress',
    'Revision Needed':'revision',
    'Confident':      'confident',
  };
  return map[status] || 'not-started';
}

// ── STATUS PICKER ──
function openPicker(questionId, event) {
  event.stopPropagation(); // don't toggle the card
  pickerQuestionId = questionId;

  const picker = document.getElementById('status-picker');
  const badge  = document.getElementById(`badge-${questionId}`);
  const rect   = badge.getBoundingClientRect();

  picker.style.top  = `${rect.bottom + window.scrollY + 6}px`;
  picker.style.left = `${rect.left + window.scrollX}px`;
  picker.classList.add('open');
}

function setupPickerDismiss() {
  document.addEventListener('click', e => {
    const picker = document.getElementById('status-picker');
    if (!picker.contains(e.target)) {
      picker.classList.remove('open');
      pickerQuestionId = null;
    }
  });
}

async function setStatus(status) {
  const questionId = pickerQuestionId;
  if (!questionId) return;

  // Close picker
  document.getElementById('status-picker').classList.remove('open');
  pickerQuestionId = null;

  // Optimistic UI update — update badge immediately
  const badge = document.getElementById(`badge-${questionId}`);
  if (badge) {
    badge.textContent  = status;
    badge.className    = `status-badge ${statusClass(status)}`;
  }

  userProgress[questionId] = status;

  // Save to backend
  try {
    const res = await fetch('/api/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questionId, status }),
    });
    if (!res.ok) throw new Error('Save failed');
  } catch (err) {
    console.error('Failed to save status:', err);
    // Could show a toast here in future
  }
}

// ── TOGGLE CARD ──
async function toggleCard(id, event) {
  // Don't toggle if clicking the status badge
  if (event?.target?.classList?.contains('status-badge')) return;

  const card  = document.getElementById(`card-${id}`);
  const panel = document.getElementById(`panel-${id}`);
  const isOpen = card.classList.contains('open');

  document.querySelectorAll('.question-card.open').forEach(c => c.classList.remove('open'));
  if (isOpen) return;

  card.classList.add('open');
  if (loadedPages[id]) { renderAnswerPanel(panel, loadedPages[id]); return; }

  try {
    const res = await fetch(`/api/page?id=${id}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    loadedPages[id] = data;
    renderAnswerPanel(panel, data);
  } catch (err) {
    panel.innerHTML = `<div class="answer-loading" style="color:var(--red)">Failed to load: ${escHtml(err.message)}</div>`;
  }
}

// ── RENDER ANSWER ──
const TAB_CONFIG = [
  { key: 'Answer',              label: 'Answer',              icon: '💬' },
  { key: 'Code Example',        label: 'Code Example',        icon: '⌨'  },
  { key: 'Key Points',          label: 'Key Points',          icon: '📌' },
  { key: 'Follow-up Questions', label: 'Follow-up Questions', icon: '🔁' },
];

function renderAnswerPanel(panel, data) {
  const tabs = TAB_CONFIG
    .filter(t => data[t.key] && data[t.key].trim())
    .map(t => `<div class="answer-tab"><div class="tab-label">${t.icon} ${t.label}</div>${data[t.key]}</div>`)
    .join('');

  panel.innerHTML = tabs
    ? `<div class="answer-sections">${tabs}</div>`
    : `<div class="answer-loading" style="color:var(--muted)">No content found.</div>`;

  if (window.Prism) Prism.highlightAllUnder(panel);
  addCopyButtons(panel);
}

// ── SEARCH ──
function setupSearch() {
  const input = document.getElementById('search');
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      searchQuery = input.value.trim().toLowerCase();
      applySearch();
    }, 220);
  });
}

function applySearch() {
  const hasSearch = searchQuery.length > 0;
  const hasFilter = statusFilter.length > 0;

  // Update filter banner
  const banner   = document.getElementById('filter-banner');
  const bannerTx = document.getElementById('filter-banner-text');
  if (hasFilter && banner) {
    banner.classList.add('visible');
    bannerTx.textContent = `Showing: ${statusFilter}`;
  } else if (banner) {
    banner.classList.remove('visible');
  }

  // Update clear button in sidebar
  const clearBtn = document.getElementById('filter-clear');
  if (clearBtn) clearBtn.style.display = hasFilter ? 'inline' : 'none';

  if (!hasSearch && !hasFilter) {
    filteredData = null;
    renderStubs(allSections);
    setupLazyLoad();
    updateSidebarCounts(allSections);
    setupScrollSpy();
    updateHeaderStats(allSections);
    return;
  }

  const filtered = allSections.map(s => ({
    ...s,
    questions: s.questions.filter(q => {
      const matchesSearch = !hasSearch ||
        q.question.toLowerCase().includes(searchQuery) ||
        q.subTopics.some(t => t.toLowerCase().includes(searchQuery));
      const matchesStatus = !hasFilter ||
        (userProgress[q.id] || 'Not Started') === statusFilter;
      return matchesSearch && matchesStatus;
    }),
  })).map(s => ({ ...s, count: s.questions.length }));

  filteredData = filtered;
  const nonEmpty = filtered.filter(s => s.questions.length > 0);

  if (nonEmpty.length === 0) {
    const msg = hasSearch && hasFilter
      ? `No "${statusFilter}" questions matching "<strong>${escHtml(searchQuery)}</strong>"`
      : hasFilter
        ? `No questions with status "<strong>${escHtml(statusFilter)}</strong>"`
        : `No questions matching "<strong>${escHtml(searchQuery)}</strong>"`;
    document.getElementById('main').innerHTML = `<div class="no-results">${msg}</div>`;
    updateSidebarCounts(filtered);
    updateHeaderStats(filtered);
    return;
  }

  renderedSlugs.clear();
  document.getElementById('main').innerHTML = nonEmpty.map(s => `
    <div class="section-block" id="${s.slug}" data-slug="${s.slug}">
      <div class="section-header">
        <span class="section-emoji">${s.icon}</span>
        <h2 class="section-title">${s.name}</h2>
        <span class="section-pill">${s.count} questions</span>
        <div class="section-actions">
          <button class="section-action-btn" onclick="expandAllInSection('${s.slug}')">expand all</button>
          <button class="section-action-btn" onclick="collapseAllInSection('${s.slug}')">collapse all</button>
        </div>
      </div>
      <div id="qc-${s.slug}"></div>
    </div>`).join('');

  nonEmpty.forEach(s => renderSectionQuestions(s.slug, searchQuery));
  updateSidebarCounts(filtered);
  updateHeaderStats(filtered);
  setupScrollSpy();
}

function updateHeaderStats(sections) {
  const total = sections.reduce((s, sec) => s + sec.count, 0);
  const allTotal = allSections.reduce((s, sec) => s + sec.count, 0);
  const el = document.getElementById('header-stats');
  if (!el) return;
  if (total < allTotal) {
    el.innerHTML = `<strong>${total}</strong> of <strong>${allTotal}</strong> questions`;
  } else {
    el.innerHTML = `<strong>${allTotal}</strong> questions · <strong>${allSections.length}</strong> topics`;
  }
}

function updateSidebarCounts(sections) {
  document.querySelectorAll('.nav-item').forEach(a => {
    const slug    = a.dataset.slug;
    const sec     = sections.find(s => s.slug === slug);
    const countEl = document.getElementById(`cnt-${slug}`);
    if (countEl) countEl.textContent = sec ? sec.count : '0';
    a.style.opacity = (!sec || sec.count === 0) ? '0.35' : '1';
  });
}

// ── SCROLL SPY ──
function setupScrollSpy() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll('.nav-item').forEach(a =>
          a.classList.toggle('active', a.dataset.slug === e.target.id));
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  document.querySelectorAll('.section-block').forEach(el => obs.observe(el));
}

// ── UTILS ──
function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function highlight(text, query) {
  const escaped = escHtml(text);
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

// ── THEME ──
function initPreferences() {
  applyTheme(localStorage.getItem('theme') || 'dark');
  applyFontSize(localStorage.getItem('fontSize') || 'md');
}

function applyTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = theme === 'dark' ? '🌙' : '☀️';
  const dark  = document.getElementById('prism-dark');
  const light = document.getElementById('prism-light');
  if (dark)  dark.disabled  = (theme !== 'dark');
  if (light) light.disabled = (theme !== 'light');
}

function toggleTheme() {
  const next = (localStorage.getItem('theme') || 'dark') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}

// ── FONT SIZE ──
const FONT_CYCLE = ['sm', 'md', 'lg'];
const FONT_LABEL = { sm: 'A−', md: 'A', lg: 'A+' };

function applyFontSize(size) {
  document.body.classList.remove('font-sm', 'font-lg');
  if (size === 'sm') document.body.classList.add('font-sm');
  if (size === 'lg') document.body.classList.add('font-lg');
  const btn = document.getElementById('font-btn');
  if (btn) btn.textContent = FONT_LABEL[size] || 'A';
}

function cycleFontSize() {
  const current = localStorage.getItem('fontSize') || 'md';
  const next    = FONT_CYCLE[(FONT_CYCLE.indexOf(current) + 1) % FONT_CYCLE.length];
  localStorage.setItem('fontSize', next);
  applyFontSize(next);
}

// ── COPY BUTTON ──
function addCopyButtons(container) {
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.querySelector('.copy-btn')) return;
    const btn = document.createElement('button');
    btn.className   = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const code = pre.querySelector('code')?.innerText || pre.innerText;
      try {
        await navigator.clipboard.writeText(code);
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
      } catch {
        btn.textContent = 'Failed';
        setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
      }
    });
    pre.appendChild(btn);
  });
}

// ── EXPAND / COLLAPSE ALL ──
function collapseAllInSection(slug) {
  document.querySelectorAll(`#qc-${slug} .question-card`)
    .forEach(c => c.classList.remove('open'));
}

async function expandAllInSection(slug) {
  const cards = Array.from(document.querySelectorAll(`#qc-${slug} .question-card`));
  cards.forEach(c => c.classList.add('open'));

  // Render already-cached pages immediately
  cards.forEach(card => {
    const id    = card.id.replace('card-', '');
    const panel = document.getElementById(`panel-${id}`);
    if (panel && loadedPages[id]) renderAnswerPanel(panel, loadedPages[id]);
  });

  // Fetch uncached pages (fire in parallel, Vercel edge cache handles rate limiting)
  const uncached = cards.filter(c => !loadedPages[c.id.replace('card-', '')]);
  await Promise.allSettled(uncached.map(card => {
    const id    = card.id.replace('card-', '');
    const panel = document.getElementById(`panel-${id}`);
    return fetch(`/api/page?id=${id}`)
      .then(r => r.json())
      .then(data => { loadedPages[id] = data; if (panel) renderAnswerPanel(panel, data); })
      .catch(() => {
        if (panel) panel.innerHTML = `<div class="answer-loading" style="color:var(--red)">Failed to load</div>`;
      });
  }));
}


// ── STATUS FILTER ──
function setStatusFilter(status) {
  statusFilter = status;
  updateFilterPills();
  applySearch();
}

function updateFilterPills() {
  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.classList.toggle('active', pill.dataset.value === statusFilter);
  });
  const clearBtn = document.getElementById('filter-clear');
  if (clearBtn) clearBtn.style.display = statusFilter ? 'inline' : 'none';
}

// ── SURPRISE ME ──
async function surpriseMe() {
  const source = filteredData || allSections;
  const pool = source.flatMap(s =>
    s.questions.map(q => ({ ...q, sectionSlug: s.slug }))
  );

  if (pool.length === 0) return;

  const pick = pool[Math.floor(Math.random() * pool.length)];

  // Ensure section is rendered
  if (!renderedSlugs.has(pick.sectionSlug)) {
    renderSectionQuestions(pick.sectionSlug);
  }

  // Scroll to section first
  const sectionEl = document.getElementById(pick.sectionSlug);
  if (sectionEl) sectionEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

  // Wait for scroll + render, then open card
  await new Promise(r => setTimeout(r, 450));

  // Close any open cards
  document.querySelectorAll('.question-card.open').forEach(c => c.classList.remove('open'));

  const card  = document.getElementById(`card-${pick.id}`);
  const panel = document.getElementById(`panel-${pick.id}`);
  if (!card || !panel) return;

  card.classList.add('open');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Highlight card briefly
  card.style.transition = 'box-shadow 0.3s';
  card.style.boxShadow  = '0 0 0 2px var(--accent), 0 4px 24px rgba(34,211,238,0.25)';
  setTimeout(() => { card.style.boxShadow = ''; }, 1800);

  // Load content
  if (loadedPages[pick.id]) {
    renderAnswerPanel(panel, loadedPages[pick.id]);
    return;
  }
  try {
    const res  = await fetch(`/api/page?id=${pick.id}`);
    const data = await res.json();
    loadedPages[pick.id] = data;
    renderAnswerPanel(panel, data);
  } catch (err) {
    panel.innerHTML = `<div class="answer-loading" style="color:var(--red)">Failed to load</div>`;
  }
}


boot();
</script>
</body>
</html>
